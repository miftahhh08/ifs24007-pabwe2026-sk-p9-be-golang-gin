swagger: '2.0'
info:
  title: Delcom Blog API
  description: 'REST API platform blog multi-tier dengan AI Blog Generator terintegrasi
    Search Engine. Klik Authorize dan isi: Bearer <token>.'
  version: '1.0'
basePath: /
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
paths:
  /api/public/categories:
    get:
      tags:
      - Public
      summary: Daftar kategori artikel
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
  /api/public/posts:
    get:
      tags:
      - Public
      summary: Daftar artikel terbit (cari & filter)
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      parameters:
      - name: q
        in: query
        description: Kata kunci
        type: string
      - name: category
        in: query
        description: Filter kategori
        type: string
  /api/public/posts/{slug}:
    get:
      tags:
      - Public
      summary: Detail artikel terbit berdasarkan slug
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      parameters:
      - name: slug
        in: path
        description: Slug artikel
        type: string
        required: true
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Registrasi penulis baru
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      consumes:
      - application/json
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Login & penerbitan token JWT
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      consumes:
      - application/json
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      security: &id001
      - BearerAuth: []
  /api/auth/profile:
    get:
      tags:
      - Auth
      summary: Profil penulis yang login
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      security: *id001
    put:
      tags:
      - Auth
      summary: Perbarui profil
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      consumes:
      - application/json
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/UpdateProfileRequest'
      security: *id001
  /api/posts:
    get:
      tags:
      - Author
      summary: Seluruh artikel milik penulis (terbit & draf)
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      security: *id001
    post:
      tags:
      - Author
      summary: Buat artikel (slug unik & reading time otomatis)
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      consumes:
      - application/json
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/PostRequest'
      security: *id001
  /api/posts/stats:
    get:
      tags:
      - Author
      summary: '3 kartu statistik: Total, Terbit, Draf'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      security: *id001
  /api/posts/ai-generate:
    post:
      tags:
      - Author
      summary: Generate draf artikel via AI + Search Engine
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      consumes:
      - application/json
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/AIGenerateRequest'
      security: *id001
  /api/posts/{id}:
    get:
      tags:
      - Author
      summary: Detail artikel milik penulis
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      parameters:
      - name: id
        in: path
        description: ID artikel
        type: string
        required: true
      security: *id001
    put:
      tags:
      - Author
      summary: Perbarui artikel
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      consumes:
      - application/json
      parameters:
      - name: id
        in: path
        description: ID artikel
        type: string
        required: true
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/PostRequest'
      security: *id001
    delete:
      tags:
      - Author
      summary: Hapus artikel
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      parameters:
      - name: id
        in: path
        description: ID artikel
        type: string
        required: true
      security: *id001
  /api/posts/{id}/toggle-publish:
    patch:
      tags:
      - Author
      summary: Toggle Draf <-> Terbit
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      parameters:
      - name: id
        in: path
        description: ID artikel
        type: string
        required: true
      security: *id001
  /api/admin/users:
    get:
      tags:
      - Admin
      summary: Seluruh pengguna + total artikel
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      security: *id001
  /api/admin/posts:
    get:
      tags:
      - Admin
      summary: Arsip seluruh artikel semua penulis
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      security: *id001
  /api/admin/users/{id}/posts:
    get:
      tags:
      - Admin
      summary: Artikel milik pengguna tertentu
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Response'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Response'
      parameters:
      - name: id
        in: path
        description: ID pengguna
        type: string
        required: true
      security: *id001
definitions:
  Response:
    type: object
    properties:
      status:
        type: string
        example: success
      message:
        type: string
      data:
        type: object
  RegisterRequest:
    type: object
    required:
    - username
    - email
    - password
    properties:
      username:
        type: string
        example: budi
      email:
        type: string
        example: budi@mail.com
      password:
        type: string
        example: rahasia123
  LoginRequest:
    type: object
    required:
    - username
    - password
    properties:
      username:
        type: string
        example: admin
      password:
        type: string
        example: admin
  UpdateProfileRequest:
    type: object
    properties:
      username:
        type: string
      email:
        type: string
      password:
        type: string
  PostRequest:
    type: object
    required:
    - title
    - content
    properties:
      title:
        type: string
        example: Belajar Go Gin
      category:
        type: string
        enum:
        - Teknologi
        - Pendidikan
        - Gaya Hidup
        - Bisnis
        - Opini
        - Umum
      excerpt:
        type: string
      content:
        type: string
        example: '# Halo


          Isi artikel **Markdown**.'
      cover_image_path:
        type: string
      is_published:
        type: boolean
  AIGenerateRequest:
    type: object
    required:
    - topic
    properties:
      topic:
        type: string
        example: Tren AI di pendidikan tinggi 2026
      category:
        type: string
        example: Teknologi
      include_web_search:
        type: boolean
        example: true
